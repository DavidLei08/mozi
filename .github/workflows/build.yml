name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # End-to-end UI suite. Informational only: a headless runner can be flaky,
  # so this never blocks the release below.
  smoke:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm 11 blocks install scripts by default; fetch the Electron binary
      # explicitly, with retries: GitHub's release-asset endpoint intermittently
      # answers 504, which used to fail the whole run.
      - name: Install Electron binary
        shell: bash
        run: |
          for i in 1 2 3; do
            node node_modules/electron/install.js && break
            [ "$i" = 3 ] && exit 1
            echo "electron install failed (attempt $i); retrying in 30s"
            sleep 30
          done
      # No screenshots on CI: capturePage is the step that stalls on headless
      # runners, and the assertions do not need it. The watchdog turns any
      # remaining stall into a fast failure instead of a 6-hour job.
      - run: npm run smoke -- --no-sandbox --disable-gpu
        env:
          MOZI_SMOKE_OUT: ${{ runner.temp }}/mozi-smoke.png
          MOZI_SMOKE_NO_SHOTS: '1'
          MOZI_SMOKE_TIMEOUT_MS: '420000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/mozi-smoke*.png

  build:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm 11 blocks install scripts by default; electronDist needs
      # node_modules/electron/dist. Retry: GitHub's release-asset endpoint
      # intermittently answers 504.
      - name: Install Electron binary
        shell: bash
        run: |
          for i in 1 2 3; do
            node node_modules/electron/install.js && break
            [ "$i" = 3 ] && exit 1
            echo "electron install failed (attempt $i); retrying in 30s"
            sleep 30
          done
      # No GH_TOKEN here: electron-builder would publish its own copy of every
      # artifact and duplicate what the release job uploads below.
      #
      # Signing/notarization is credential-driven: with repository secrets set
      # (CSC_LINK + CSC_KEY_PASSWORD for the Developer ID cert, APPLE_ID +
      # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID for notarytool, WIN_CSC_* for
      # Windows) the build is signed and notarized; without them it stays
      # unsigned and CI still produces artifacts. Retries cover the
      # intermittent 504s from GitHub's release-asset endpoint.
      - name: Package (${{ matrix.script }})
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # An *empty* CSC_LINK is not the same as an absent one: electron-builder
          # treats the empty value as a certificate path and dies with
          # "empty password will be used for code signing" plus a nonsensical
          # "<project dir> not a file". Clear them when unset, and state the
          # unsigned case explicitly instead of leaving identity undefined.
          [ -z "${CSC_LINK:-}" ] && unset CSC_LINK
          [ -z "${CSC_KEY_PASSWORD:-}" ] && unset CSC_KEY_PASSWORD
          [ -z "${WIN_CSC_LINK:-}" ] && unset WIN_CSC_LINK
          [ -z "${WIN_CSC_KEY_PASSWORD:-}" ] && unset WIN_CSC_KEY_PASSWORD

          EXTRA=""
          if [ -n "${CSC_LINK:-}" ]; then
            echo "signing with the supplied certificate"
          else
            EXTRA="-c.mac.identity=null"
            echo "no certificate: building unsigned (mac.identity=null)"
          fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            EXTRA="$EXTRA -c.mac.notarize=true"
            echo "notarization enabled"
          fi

          for i in 1 2 3; do
            # $EXTRA is always non-empty now; quoting keeps a multi-flag value intact
            npm run ${{ matrix.script }} -- $EXTRA && break
            [ "$i" = 3 ] && exit 1
            echo "packaging failed (attempt $i); retrying in 30s"
            sleep 30
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mozi-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mozi-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # a re-tagged build must be able to replace its own assets
          overwrite_files: true
          files: dist/*
          body: |
            本地优先的桌面工具箱，13 个工具，数据不出机器。

            ## 本版重点：Markdown 编辑器重做

            - **头部操作改为图标按钮**，悬停显示提示（另存为 / 打开 / 全屏预览 / 插入示例 / 复制 HTML / 导出 HTML）
            - **编辑框内快捷操作栏**：`B` `I` `H` `S`；`列表▾`（无序 / 有序 / 任务清单）、
              `代码块▾`（行内代码 / 代码块 / 引用 + **26 种语言**）、`格式▾`（H1-H3 / 分隔线 / 清除标记）、
              `插入▾`（表格 / 折叠块 / 日期 / 时间），另有图片与链接按钮
            - **下拉同时只展开一个**：打开新菜单会自动收起其他，点击别处全部关闭
            - **保存与另存为**：`⌘S` 写回已打开的 `.md`，没有文件则弹出保存框；按钮上的红点表示尚未写入文件
            - **草稿自动保存**：内容与来源文件一并持久化，重启后自动恢复
            - 全屏预览、相对路径图片、Mermaid 流程图照旧

            ## 修复

            - **下拉浮层背景透明**：`--panel` / `--muted` / `--line-strong` 等 6 个 CSS 变量被引用却从未定义，
              导致弹层没有底板、弱化文字失去层次。两套主题均已补齐，并新增单元测试守卫
            - **`⌘S` 在 Markdown 里会跳去请求工具**：原生菜单加速键先于页面 JS 触发，其处理器强制切到请求工具
              并打开「保存请求」对话框。现改为视图感知的调度器，Markdown 认领自己的保存
            - **插入图片 / 粘贴图片完全无效**：主进程 `mimeForPath` 只有调用没有定义，错误又被 IPC 处理器自己的
              catch 吞掉，前端只得到一条静默失败。已补上实现，并支持「Finder 里复制图片文件后直接粘贴」
            - Markdown 初始化被中断：`addEventListener` 指向不存在的元素会抛错并中止整个工具初始化

            ## 记事本

            - 富文本编辑（加粗 / 标题 / 列表 / 引用 / 代码 / 链接），**三种方式插入图片**（选择文件 / 粘贴 / 拖拽）
            - **可编辑标题**：手填标题不会被正文首行覆盖，清空后自动回退
            - 多笔记列表、草稿自动保存、导出 HTML；入库前白名单净化

            ## 待办任务

            - 主题（必填）+ 描述（可选）+ 预期完成时间（默认当天）
            - 逾期标红并显示天数；行内改期、勾选完成、编辑、二次确认删除
            - 按月份归档：当月与未来铺开，已完成往月任务进入折叠的「归档」

            ## 安装

            未签名。macOS 首次打开若提示「已损坏」：

            ```
            xattr -dr com.apple.quarantine /Applications/Mozi.app
            ```

            Windows SmartScreen 选择「仍要运行」。